name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        run: npm install

      - name: Copie des librairies
        run: npm run vendor

      - name: Projet Android
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: astra-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AstraLauncher.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Astra Launcher ${{ github.run_number }}
          files: AstraLauncher.apk
          make_latest: true
